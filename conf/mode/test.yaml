# Test Settings
mode: test
experiment_name: my_experiment # Base experiment name (will be combined with model/dataset params)
# Alternatively, use +mode.experiment_name_full=... to specify the full checkpoint folder name directly
# Example: python test.py mode=test +mode.experiment_name_full=unet_256_soundspaces_BS16_Lr0.001_AdamW_my_experiment mode.checkpoints=50

eval_on: test # Evaluation on 'test' or 'val' set
checkpoints: 50 # Epoch to load
criterion: L1 # Criterion for evaluation
stat_dir: ./eval/ # Folder to save evaluation results

# Parameters needed to construct experiment name (should match training config)
batch_size: 16 # Should match training batch size
learning_rate: 0.001 # Should match training learning rate
optimizer: AdamW # Should match training optimizer

num_threads: 4
max_vis_samples: 500 # Max number of samples to visualize (set -1 for all)
